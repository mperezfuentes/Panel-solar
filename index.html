  DB.nota.push(nnota({id:'N:d1',fecha:days[0],vendedor:'Matías Núñez',compromiso:'Hacer 2 visitas conjuntas por semana',limite:days[Math.min(1,days.length-1)],estado:'Pendiente',nota:'Revisar cómo presenta la cotización'}),nnota({id:'N:d2',fecha:days[0],vendedor:'Felipe Araya',compromiso:'Reactivar 5 cotizaciones abiertas',limite:bdays[dt],estado:'Pendiente'}),nnota({id:'N:d3',fecha:days[0],vendedor:'Camila Rojas',compromiso:'Compartir su guion de cierre con el equipo',estado:'Cumplido'}));
  demo=true;sv(K.demo,true);sv(K.dd,days[days.length-1]);saveAll();per=cm;render();toast('Datos de ejemplo cargados (solo en este equipo)')}

  (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Enlace copiado. Envíatelo y ábrelo en el otro equipo')).catch(()=>prompt('Copia este enlace:',link))};
